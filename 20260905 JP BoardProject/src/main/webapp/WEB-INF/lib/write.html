<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="writeTitle">新規投稿作成</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
    }
    .write-container {
      background-color: white;
      width: 100%;
      max-width: 650px;
      padding: 30px 40px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #007bff;
      padding-bottom: 12px;
    }
    .header-bar h2 { margin: 0; color: #007bff; }
    .lang-group { display: flex; gap: 5px; }
    .lang-btn {
      padding: 4px 10px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #007bff;
      background-color: white;
      color: #007bff;
      border-radius: 4px;
      cursor: pointer;
    }
    .lang-btn.active { background-color: #007bff; color: white; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 180px; }
    .btn-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
    .btn {
      padding: 9px 18px;
      font-size: 14px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
    }
    .btn-save { background-color: #007bff; color: white; }
    .btn-back { background-color: #6c757d; color: white; }
  </style>
</head>
<body>
  <div class="write-container">
    <div class="header-bar">
      <h2 data-i18n="writeTitle">新規投稿作成</h2>
      <div class="lang-group">
        <span>🌐</span>
        <button type="button" class="lang-btn" id="btnJa" onclick="changeLanguage('ja')">日本語</button>
        <button type="button" class="lang-btn" id="btnKo" onclick="changeLanguage('ko')">한국어</button>
      </div>
    </div>

    <!-- 相対パス指定 -->
    <form action="api/board" method="post">
      <div class="form-group">
        <label for="title" data-i18n="postTitleLabel">タイトル</label>
        <input type="text" id="title" name="title" required>
      </div>

      <div class="form-group">
        <label for="content" data-i18n="postContentLabel">内容</label>
        <textarea id="content" name="content" required></textarea>
      </div>

      <div class="btn-row">
        <a href="board.html" class="btn btn-back" data-i18n="backToList">一覧へ戻る</a>
        <button type="submit" class="btn btn-save" data-i18n="saveBtn">保存</button>
      </div>
    </form>
  </div>

  <script src="lang.js"></script>
</body>
</html>
