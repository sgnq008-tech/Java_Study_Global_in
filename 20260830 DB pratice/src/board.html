<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>게시판</title>
  </head>
  <body>
    <h2>게시판 목록</h2>

    <div id="userInfo"></div>
    <br />

    <table border="1" style="width: 500px; text-align: center">
      <thead>
        <tr>
          <th>번호</th>
          <th>제목</th>
          <th>작성자</th>
          <th>작성일</th>
        </tr>
      </thead>
      <tbody id="boardBody">
        <!-- 데이터가 비동기로 삽입됩니다 -->
      </tbody>
    </table>

    <script>
      // 1. 세션 로그인 상태 확인
      fetch("/api/auth")
        .then((res) => res.text())
        .then((user) => {
          const infoDiv = document.getElementById("userInfo");
          if (user) {
            infoDiv.innerHTML = `<b>${user}</b>님 환영합니다! | 
                        <a href="write.html">글쓰기</a> | 
                        <form action="/api/auth" method="post" style="display:inline;">
                            <button type="submit">로그아웃</button>
                        </form>`;
          } else {
            infoDiv.innerHTML = `<a href="login.html">로그인</a> | <a href="join.html">회원가입</a>`;
          }
        });

      // 2. 게시글 목록 불러오기
      fetch("/api/board")
        .then((res) => res.json())
        .then((list) => {
          const tbody = document.getElementById("boardBody");
          if (list.length === 0) {
            tbody.innerHTML =
              '<tr><td colspan="4">등록된 글이 없습니다.</td></tr>';
            return;
          }
          tbody.innerHTML = list
            .map(
              (item) => `
                    <tr>
                        <td>${item.bno}</td>
                        <td>${item.title}</td>
                        <td>${item.writer}</td>
                        <td>${item.date}</td>
                    </tr>
                `,
            )
            .join("");
        });
    </script>
  </body>
</html>
