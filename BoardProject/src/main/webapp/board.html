<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게시판 목록</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding-top: 50px;
      background-color: #f4f6f9;
    }
    .board-container {
      background-color: white;
      padding: 30px 40px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 750px;
    }
    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #007bff;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .header-area h2 {
      margin: 0;
      color: #333;
    }
    .user-info {
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      padding: 6px 12px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 13px;
      cursor: pointer;
      border: none;
    }
    .btn-write {
      background-color: #007bff;
      color: white;
    }
    .btn-logout {
      background-color: #dc3545;
      color: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
    }
    th {
      background-color: #f8f9fa;
      color: #333;
    }
    td.title {
      text-align: left;
    }
    td.title a {
      color: #333;
      text-decoration: none;
    }
    td.title a:hover {
      text-decoration: underline;
      color: #007bff;
    }
    .no-data {
      padding: 40px 0;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="board-container">
    <div class="header-area">
      <h2>게시판 목록</h2>
      <div class="user-info">
        <span id="userNameDisplay">회원님 환영합니다!</span>
        <a href="/BoardProject/write.html" class="btn btn-write">글쓰기</a>
        <a href="/BoardProject/api/logout" class="btn btn-logout">로그아웃</a>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width: 10%;">번호</th>
          <th style="width: 50%;">제목</th>
          <th style="width: 20%;">작성자</th>
          <th style="width: 20%;">작성일</th>
        </tr>
      </thead>
      <tbody id="boardListBody">
        <tr>
          <td colspan="4" class="no-data">게시글을 불러오는 중입니다...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // 1. 게시글 목록 불러오기
    fetch('/BoardProject/api/board')
      .then(response => {
        if (!response.ok) throw new Error('목록 조회 실패');
        return response.json();
      })
      .then(data => {
        const tbody = document.getElementById('boardListBody');
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="no-data">등록된 글이 없습니다.</td></tr>';
          return;
        }

        data.forEach(item => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${item.bno}</td>
            <td class="title"><a href="/BoardProject/detail.html?bno=${item.bno}">${item.title}</a></td>
            <td>${item.writer}</td>
            <td>${item.regDate}</td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch(err => {
        console.error(err);
        document.getElementById('boardListBody').innerHTML = 
          '<tr><td colspan="4" class="no-data">목록을 불러오는 중 오류가 발생했습니다.</td></tr>';
      });
  </script>
</body>
</html>
