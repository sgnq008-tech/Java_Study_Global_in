<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f4f6f9;
      }
      .container {
        background-color: white;
        padding: 30px 40px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 320px;
      }
      h2 {
        margin-top: 0;
        margin-bottom: 20px;
        text-align: center;
        color: #28a745;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
        color: #555;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      .error-msg {
        color: #e74c3c;
        font-size: 13px;
        text-align: center;
        margin-bottom: 15px;
        display: none;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 5px;
      }
      button:hover {
        background-color: #218838;
      }
      .link {
        text-align: center;
        margin-top: 15px;
        font-size: 13px;
      }
      .link a {
        color: #007bff;
        text-decoration: none;
        font-weight: bold;
      }
      .link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>로그인</h2>

      <div id="errorMsg" class="error-msg">
        아이디 또는 비밀번호가 일치하지 않습니다.
      </div>

      <form action="api/login" method="post">
        <div class="form-group">
          <label for="userId">아이디</label>
          <input
            type="text"
            id="userId"
            name="userId"
            placeholder="아이디 입력"
            required
          />
        </div>

        <div class="form-group">
          <label for="userPw">비밀번호</label>
          <input
            type="password"
            id="userPw"
            name="userPw"
            placeholder="비밀번호 입력"
            required
          />
        </div>

        <button type="submit">로그인</button>
      </form>

      <div class="link">
        계정이 없으신가요? <a href="join.html">회원가입 바로가기</a>
      </div>
    </div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has("error")) {
        document.getElementById("errorMsg").style.display = "block";
      }
    </script>
  </body>
</html>
