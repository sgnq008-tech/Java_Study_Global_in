<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>글쓰기</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f4f6f9;
        color: #333;
      }
      .container {
        background-color: white;
        padding: 30px 40px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 480px;
      }
      h2 {
        margin-top: 0;
        margin-bottom: 20px;
        text-align: center;
        color: #333;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        font-size: 14px;
        color: #555;
      }
      input[type="text"],
      textarea {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        font-family: inherit;
      }
      textarea {
        resize: vertical;
        height: 150px;
      }
      .btn-group {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      button {
        flex: 1;
        padding: 10px;
        font-size: 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      .btn-submit {
        background-color: #007bff;
        color: white;
      }
      .btn-submit:hover {
        background-color: #0056b3;
      }
      .btn-cancel {
        background-color: #6c757d;
        color: white;
      }
      .btn-cancel:hover {
        background-color: #5a6268;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>게시글 작성</h2>
      
      <form action="api/board" method="post">
        <div class="form-group">
          <label for="title">제목</label>
          <input
            type="text"
            id="title"
            name="title"
            placeholder="제목을 입력하세요"
            required
          />
        </div>

        <div class="form-group">
          <label for="content">내용</label>
          <textarea
            id="content"
            name="content"
            placeholder="내용을 입력하세요"
            required
          ></textarea>
        </div>

        <div class="btn-group">
          <button type="submit" class="btn-submit">등록</button>
          <button
            type="button"
            class="btn-cancel"
            onclick="location.href = '/BoardProject/board.html'"
          >
            취소
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
