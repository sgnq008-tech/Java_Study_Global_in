<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="writeTitle">アニメの感想・レビュー投稿</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
    }
    .write-container {
      background-color: white;
      width: 100%;
      max-width: 650px;
      padding: 30px 40px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #e63946;
      padding-bottom: 12px;
    }
    .header-bar h2 { margin: 0; color: #e63946; font-size: 20px; }
    .lang-group { display: flex; gap: 5px; }
    .lang-btn {
      padding: 4px 8px;
      font-size: 11px;
      font-weight: bold;
      border: 1px solid #e63946;
      background-color: white;
      color: #e63946;
      border-radius: 4px;
      cursor: pointer;
    }
    .lang-btn.active { background-color: #e63946; color: white; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #495057; font-size: 14px; }
    input[type="text"], select, textarea {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 180px; }
    .btn-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
    .btn {
      padding: 9px 18px;
      font-size: 14px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
    }
    .btn-save { background-color: #e63946; color: white; }
    .btn-back { background-color: #6c757d; color: white; }
  </style>
</head>
<body>
  <div class="write-container">
    <div class="header-bar">
      <h2 data-i18n="writeTitle">アニメの感想・レビュー投稿</h2>
      
      <!-- 3ヶ国語切り替え -->
      <div class="lang-group">
        <span style="font-size: 12px; margin-top: 2px;">🌐</span>
        <button type="button" class="lang-btn" id="btnJa" onclick="changeLanguage('ja')">日本語</button>
        <button type="button" class="lang-btn" id="btnKo" onclick="changeLanguage('ko')">한국어</button>
        <button type="button" class="lang-btn" id="btnEn" onclick="changeLanguage('en')">EN</button>
      </div>
    </div>

    <form action="api/board" method="post">
      <div class="form-group">
        <label for="animeTitle" data-i18n="animeTitleLabel">アニメ作品名</label>
        <input type="text" id="animeTitle" name="animeTitle" data-i18n-placeholder="animePlaceholder" placeholder="例：呪術廻戦、僕のヒーローアカデミア" required>
      </div>

      <div class="form-group">
        <label for="rating" data-i18n="ratingLabel">評価（星評価）</label>
        <select id="rating" name="rating">
          <option value="5" data-i18n-opt="rating5">★★★★★ (5点 - 最高)</option>
          <option value="4" data-i18n-opt="rating4">★★★★☆ (4点 - 良い)</option>
          <option value="3" data-i18n-opt="rating3">★★★☆☆ (3点 - 普通)</option>
          <option value="2" data-i18n-opt="rating2">★★☆☆☆ (2点 - 微妙)</option>
          <option value="1" data-i18n-opt="rating1">★☆☆☆☆ (1点 - 不満)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="title" data-i18n="postTitleLabel">レビュータイトル</label>
        <input type="text" id="title" name="title" data-i18n-placeholder="postTitlePlaceholder" placeholder="レビューの要約やタイトルを入力" required>
      </div>

      <div class="form-group">
        <label for="content" data-i18n="postContentLabel">感想・レビュー本文</label>
        <textarea id="content" name="content" data-i18n-placeholder="postContentPlaceholder" placeholder="アニメの感想や考察を自由に入力してください" required></textarea>
      </div>

      <div class="btn-row">
        <a href="board.html" class="btn btn-back" data-i18n="backToList">一覧へ戻る</a>
        <button type="submit" class="btn btn-save" data-i18n="saveBtn">レビュー登録</button>
      </div>
    </form>
  </div>

  <script src="lang.js"></script>
</body>
</html>
